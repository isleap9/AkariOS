# A release: push a tag v<version> that matches $AkariVersion in Core/Version.ps1.
#   git tag -a v0.1.0 -m "release notes here"   (an annotated tag's message becomes the notes; else GitHub writes them)
#   git push origin v0.1.0
# Builds AkariOS-<version>.zip (one AkariOS\ folder with what Akari runs from) and Akari.ps1 (build/Bootstrap.ps1 filled in:
# the one-liner `iwr .../releases/latest/download/Akari.ps1 -useb | iex`), and the native app (WinUI 3, ADR 0009): its
# tests first, then build/Native.ps1 = AkariOS-Native.exe (portable) and AkariOS-Native-Setup.exe (Inno Setup,
# build/AkariOS-Native.iss), each one's ProductVersion checked; all four are published. Both updaters (Core/Update.ps1, app/AkariOS.Core/Update/) read the latest release and check their file against the SHA-256 GitHub
# reports for it.
# Windows runner: files get CRLF line endings, like a Windows checkout (.cmd and .reg files need them).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        shell: pwsh
        run: |
          $ver = (Select-String -Path src/Core/Version.ps1 -Pattern "AkariVersion = '([^']+)'").Matches[0].Groups[1].Value
          if ("v$ver" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match `$AkariVersion = '$ver' in src/Core/Version.ps1" }
          "AKARI_VERSION=$ver" >> $env:GITHUB_ENV

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: app/global.json

      # a failing native test stops the release (run from app/: global.json picks the Microsoft Testing Platform)
      - name: Test the native app
        shell: pwsh
        working-directory: app
        run: dotnet test --solution AkariOS.Native.sln

      - name: Build the native app and its installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { throw 'Inno Setup did not install' } }
          powershell -NoProfile -ExecutionPolicy Bypass -File build/Native.ps1 -Iscc $iscc -Out dist
          if ($LASTEXITCODE -ne 0) { throw 'build/Native.ps1 failed' }

      - name: Build the zip
        shell: pwsh
        run: |
          $ver = $env:AKARI_VERSION
          New-Item dist/AkariOS -ItemType Directory -Force | Out-Null
          # everything in src/ (Akari.ps1 and its folders) plus the license and credits, in one AkariOS\ folder
          Copy-Item src/* dist/AkariOS -Recurse
          Copy-Item LICENSE, CREDITS.md dist/AkariOS
          # AkariOS.exe: the launcher (build/Launcher.cs), compiled with the .NET Framework's own compiler. Its paths
          # take backslashes: csc reads a / in a file name as the start of an option ("Launcher.cs could not be opened")
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc -nologo -target:exe -platform:anycpu -win32icon:src\Assets\AkariLogo.ico -win32manifest:build\Launcher.manifest -out:dist\AkariOS\AkariOS.exe build\Launcher.cs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path dist/AkariOS/AkariOS.exe)) { throw 'AkariOS.exe did not compile' }
          Compress-Archive dist/AkariOS "dist/AkariOS-$ver.zip"
          # the one-liner's Akari.ps1: build/Bootstrap.ps1 with this release's version and the zip's SHA-256
          $sha = (Get-FileHash "dist/AkariOS-$ver.zip" -Algorithm SHA256).Hash
          $boot = (Get-Content build/Bootstrap.ps1 -Raw).Replace('__AKARI_VERSION__', $ver).Replace('__AKARI_SHA256__', $sha)
          if ($boot -match '__AKARI_') { throw 'build/Bootstrap.ps1 still has a placeholder' }
          [IO.File]::WriteAllText("$PWD/dist/Akari.ps1", $boot, [Text.UTF8Encoding]::new($false))

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          # checkout may leave an annotated tag lightweight: fetch it as it is
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          $notes = if ((git cat-file -t $tag) -eq 'tag') { '--notes-from-tag' } else { '--generate-notes' }
          gh release create $tag "dist/AkariOS-$env:AKARI_VERSION.zip" dist/Akari.ps1 dist/AkariOS-Native.exe dist/AkariOS-Native-Setup.exe --title "AkariOS $env:AKARI_VERSION" $notes

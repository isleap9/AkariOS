<!doctype html>
<html lang="en" data-theme="dark" data-accent="akari" data-theme-pref="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AkariOS prototype</title>
<style>
/* ---------- tokens: WinUI 3 values ---------- */
:root, [data-theme="dark"] {
  --mica: #202020; --layer: rgba(58,58,58,.30); --layerEdge: rgba(255,255,255,.07);
  --card: rgba(255,255,255,.051); --card2: rgba(255,255,255,.031); --cardH: rgba(255,255,255,.085); --cardStroke: rgba(0,0,0,.10);
  --div: rgba(255,255,255,.084); --flyout: #2c2c2c; --flyStroke: rgba(117,117,117,.4);
  --tx: #fff; --tx2: rgba(255,255,255,.786); --tx3: rgba(255,255,255,.545); --txDis: rgba(255,255,255,.363);
  --ctl: rgba(255,255,255,.061); --ctlH: rgba(255,255,255,.084); --ctlP: rgba(255,255,255,.033);
  --ctlStroke: rgba(255,255,255,.07); --ctlStroke2: rgba(255,255,255,.093); --strong: rgba(255,255,255,.545);
  --sub: rgba(255,255,255,.061); --subP: rgba(255,255,255,.042); --inFocus: rgba(30,30,30,.7);
  --focus: #fff; --focusIn: rgba(0,0,0,.7); --smoke: rgba(0,0,0,.3);
  --ok: #6ccb5f; --okBg: #393d1b; --warn: #fce100; --warnBg: #433519; --bad: #ff99a4; --badBg: #442726; --infoBg: rgba(255,255,255,.031);
  --shadowFly: 0 8px 16px rgba(0,0,0,.26); --shadowDlg: 0 32px 64px rgba(0,0,0,.37), 0 2px 21px rgba(0,0,0,.37);
  --wall: radial-gradient(1200px 800px at 10% -10%, #3a1d25 0%, transparent 60%), radial-gradient(900px 700px at 100% 100%, #1d2433 0%, transparent 60%), #181818;
}
[data-theme="light"] {
  --mica: #f3f3f3; --layer: rgba(255,255,255,.5); --layerEdge: rgba(0,0,0,.059);
  --card: rgba(255,255,255,.7); --card2: rgba(246,246,246,.5); --cardH: rgba(249,249,249,.5); --cardStroke: rgba(0,0,0,.059);
  --div: rgba(0,0,0,.059); --flyout: #f9f9f9; --flyStroke: rgba(0,0,0,.059);
  --tx: rgba(0,0,0,.894); --tx2: rgba(0,0,0,.62); --tx3: rgba(0,0,0,.56); --txDis: rgba(0,0,0,.361);
  --ctl: rgba(255,255,255,.7); --ctlH: rgba(249,249,249,.5); --ctlP: rgba(249,249,249,.3);
  --ctlStroke: rgba(0,0,0,.059); --ctlStroke2: rgba(0,0,0,.162); --strong: rgba(0,0,0,.446);
  --sub: rgba(0,0,0,.037); --subP: rgba(0,0,0,.024); --inFocus: #fff;
  --focus: rgba(0,0,0,.894); --focusIn: rgba(255,255,255,.7); --smoke: rgba(0,0,0,.3);
  --ok: #0f7b0f; --okBg: #dff6dd; --warn: #9d5d00; --warnBg: #fff4ce; --bad: #c42b1c; --badBg: #fde7e9; --infoBg: rgba(246,246,246,.5);
  --shadowFly: 0 8px 16px rgba(0,0,0,.14); --shadowDlg: 0 32px 64px rgba(0,0,0,.19), 0 2px 21px rgba(0,0,0,.15);
  --wall: radial-gradient(1200px 800px at 10% -10%, #f6dfe3 0%, transparent 60%), radial-gradient(900px 700px at 100% 100%, #dde5f3 0%, transparent 60%), #eceef2;
}
/* accents, derived the way Windows derives its accent shades */
[data-theme="dark"][data-accent="akari"]  { --acc: #ff6b7d; --accH: #ff6b7de6; --accP: #ff6b7dcc; --accT: #000; --accTx: #ffa3ae; --accSoft: rgba(255,107,125,.12); }
[data-theme="light"][data-accent="akari"] { --acc: #c8102e; --accH: #c8102ee6; --accP: #c8102ecc; --accT: #fff; --accTx: #9e0c24; --accSoft: rgba(200,16,46,.08); }
[data-theme="dark"][data-accent="windows"]  { --acc: #4cc2ff; --accH: #4cc2ffe6; --accP: #4cc2ffcc; --accT: #000; --accTx: #99ebff; --accSoft: rgba(76,194,255,.12); }
[data-theme="light"][data-accent="windows"] { --acc: #0067c0; --accH: #0067c0e6; --accP: #0067c0cc; --accT: #fff; --accTx: #003e92; --accSoft: rgba(0,103,192,.08); }
:root { --ease: cubic-bezier(0,0,0,1); --easeIO: cubic-bezier(.55,.55,0,1); --fast: 83ms; --norm: 167ms; --slow: 250ms; --page: 333ms; }
@media (prefers-reduced-motion: reduce) { :root { --fast: 0ms; --norm: 0ms; --slow: 0ms; --page: 0ms; } }

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--wall); font: 400 14px/20px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--tx);
  display: grid; place-items: center; -webkit-font-smoothing: antialiased; transition: background var(--slow); overflow: hidden; }
svg.i { width: 16px; height: 16px; fill: currentColor; flex: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
:focus { outline: none; }
.kb :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; box-shadow: inset 0 0 0 1px var(--focusIn); }
.cap { font: 400 12px/16px "Segoe UI Variable Small", "Segoe UI", sans-serif; }
.t2 { color: var(--tx2); } .t3 { color: var(--tx3); }
.mono { font: 400 12px/16px "Cascadia Mono", Consolas, monospace; color: var(--tx3); }

/* ---------- window ---------- */
.win { position: relative; width: min(1180px, calc(100vw - 48px)); height: min(760px, calc(100vh - 48px)); border-radius: 8px; overflow: hidden;
  background: var(--mica); box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.25); display: grid; grid-template-rows: 48px 1fr; grid-template-columns: auto 1fr;
  transition: background var(--slow); }
.win::before { content: ""; position: absolute; inset: 0; background: var(--wall); opacity: .18; filter: blur(60px); pointer-events: none; } /* Mica: a hint of the wallpaper */
.titlebar { grid-column: 1 / 3; position: relative; display: flex; align-items: center; z-index: 3; }
.back { width: 40px; height: 36px; margin-left: 4px; border-radius: 4px; display: grid; place-items: center; color: var(--tx2); transition: background var(--fast), opacity var(--norm); }
.back:hover { background: var(--sub); } .back:active { background: var(--subP); }
.back[disabled] { opacity: .35; pointer-events: none; }
.pane-btn { width: 40px; height: 36px; border-radius: 4px; display: grid; place-items: center; color: var(--tx2); }
.pane-btn:hover { background: var(--sub); }
.titlebar img { width: 16px; height: 16px; margin: 0 12px 0 6px; }
.titlebar .name { font: 400 12px/16px "Segoe UI Variable Small", "Segoe UI", sans-serif; }
.titlebar .ver { margin-left: 8px; color: var(--tx3); font: 400 12px "Segoe UI"; }
.caps { margin-left: auto; align-self: flex-start; display: flex; }
.caps span { width: 46px; height: 32px; display: grid; place-items: center; color: var(--tx); transition: background var(--fast); }
.caps span svg { width: 10px; height: 10px; }
.caps span:hover { background: var(--sub); } .caps .x:hover { background: #c42b1c; color: #fff; }
[data-theme="light"] .logo-d, [data-theme="dark"] .logo-l { display: none; }

/* ---------- NavigationView ---------- */
.nav { position: relative; z-index: 2; width: 280px; padding: 0 0 8px; display: flex; flex-direction: column; transition: width var(--slow) var(--ease); overflow: hidden; }
.win.compact .nav { width: 48px; }
.search { margin: 0 16px 8px; position: relative; transition: opacity var(--norm); }
.win.compact .search { opacity: 0; pointer-events: none; }
.input { width: 100%; height: 32px; padding: 0 32px 0 11px; font: inherit; color: var(--tx); background: var(--ctl); border: 1px solid var(--ctlStroke); border-bottom-color: var(--strong);
  border-radius: 4px; transition: background var(--fast); }
.input::placeholder { color: var(--tx3); } .input:hover { background: var(--ctlH); }
.input:focus { background: var(--inFocus); border-bottom: 2px solid var(--acc); padding-bottom: 1px; }
.search svg { position: absolute; right: 10px; top: 9px; width: 14px; height: 14px; color: var(--tx2); }
.items { position: relative; flex: 1; }
.ni { position: relative; display: flex; align-items: center; gap: 16px; height: 36px; margin: 2px 4px; padding: 0 12px; border-radius: 4px; white-space: nowrap; width: calc(100% - 8px);
  transition: background var(--fast); }
.ni:hover { background: var(--sub); } .ni:active { background: var(--subP); }
.ni:active svg { transform: scale(.9); } .ni svg { transition: transform var(--fast) var(--ease); }
.ni.on { background: var(--sub); }
.ni .f { display: none; } .ni.on .f { display: block; color: var(--accTx); } .ni.on .r { display: none; }
.ni .chev { margin-left: auto; width: 12px; height: 12px; color: var(--tx2); transition: transform var(--norm) var(--ease); }
.ni.open .chev { transform: rotate(180deg); }
.kids { overflow: hidden; height: 0; transition: height var(--norm) var(--ease); }
.kids .ni { padding-left: 48px; }
.win.compact .kids { height: 0 !important; }
.pill { position: absolute; left: 4px; width: 3px; height: 16px; border-radius: 2px; background: var(--acc); top: 0; pointer-events: none; z-index: 2; }
.navsep { height: 1px; background: var(--div); margin: 4px 0; }
.navfoot { margin-top: auto; position: relative; }

/* ---------- content layer ---------- */
.layer { position: relative; z-index: 1; background: var(--layer); border-top: 1px solid var(--layerEdge); border-left: 1px solid var(--layerEdge); border-top-left-radius: 8px; overflow: hidden; }
.scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
.scroll::-webkit-scrollbar { width: 12px; } .scroll::-webkit-scrollbar-thumb { background: var(--strong); border-radius: 6px; border: 4px solid transparent; background-clip: padding-box; }
.page { max-width: 1064px; padding: 28px 36px 120px; }
.enter > * { animation: rise var(--page) var(--ease) both; }
.enter > *:nth-child(2) { animation-delay: 30ms; } .enter > *:nth-child(3) { animation-delay: 60ms; } .enter > *:nth-child(4) { animation-delay: 90ms; }
.enter > *:nth-child(5) { animation-delay: 120ms; } .enter > *:nth-child(n+6) { animation-delay: 150ms; }
@keyframes rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
.head { font: 600 28px/36px "Segoe UI Variable Display", "Segoe UI", sans-serif; display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.head .crumb { color: var(--tx2); border-radius: 4px; transition: color var(--fast); } .head .crumb:hover { color: var(--tx); }
.head svg { width: 16px; height: 16px; color: var(--tx2); }
.sect { font: 600 14px/20px "Segoe UI Variable Text", "Segoe UI"; margin: 30px 0 8px 1px; }
.stack { display: flex; flex-direction: column; gap: 4px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 4px; background: var(--ctl);
  border: 1px solid var(--ctlStroke); border-bottom-color: var(--ctlStroke2); transition: background var(--fast), color var(--fast); white-space: nowrap; }
.btn:hover { background: var(--ctlH); } .btn:active { background: var(--ctlP); color: var(--tx2); border-bottom-color: var(--ctlStroke); }
.btn.acc { background: var(--acc); color: var(--accT); border-color: rgba(255,255,255,.08); border-bottom-color: rgba(0,0,0,.4); min-width: 120px; }
.btn.acc:hover { background: var(--accH); } .btn.acc:active { background: var(--accP); color: var(--accT); }
.btn.sub { background: transparent; border-color: transparent; } .btn.sub:hover { background: var(--sub); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link { color: var(--accTx); } .link:hover { text-decoration: underline; }

.tog { display: inline-flex; align-items: center; gap: 12px; color: var(--tx); user-select: none; }
.tog .lbl { min-width: 22px; text-align: right; color: var(--tx2); }
.track { position: relative; width: 40px; height: 20px; border-radius: 10px; border: 1px solid var(--strong); background: var(--ctl); transition: background var(--norm), border-color var(--norm); }
.thumb { position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 6px; background: var(--strong);
  transition: left var(--norm) var(--ease), width var(--fast) var(--ease), height var(--fast) var(--ease), top var(--fast) var(--ease), background var(--norm); }
.tog:hover .track { background: var(--ctlH); } .tog:hover .thumb { width: 14px; height: 14px; top: 2px; left: 2px; }
.tog:active .thumb { width: 17px; }
.tog.on .track { background: var(--acc); border-color: var(--acc); } .tog.on .thumb { left: 23px; background: var(--accT); }
.tog.on:hover .track { background: var(--accH); } .tog.on:hover .thumb { left: 22px; } .tog.on:active .thumb { left: 19px; }

.chk { display: inline-flex; align-items: center; gap: 8px; user-select: none; }
.box { width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--strong); background: var(--ctlP); display: grid; place-items: center; flex: none; transition: background var(--fast), border-color var(--fast); }
.chk:hover .box { background: var(--ctlH); }
.box svg { width: 12px; height: 12px; color: var(--accT); stroke: var(--accT); }
.box path.tick { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14; stroke-dashoffset: 14; transition: stroke-dashoffset var(--norm) var(--ease); }
.chk.on .box { background: var(--acc); border-color: var(--acc); } .chk.on .box path.tick { stroke-dashoffset: 0; }

.combo { position: relative; display: inline-flex; align-items: center; min-width: 200px; height: 32px; padding: 0 34px 0 11px; border-radius: 4px; background: var(--ctl);
  border: 1px solid var(--ctlStroke); border-bottom-color: var(--ctlStroke2); transition: background var(--fast); }
.combo:hover { background: var(--ctlH); } .combo svg { position: absolute; right: 11px; width: 12px; height: 12px; color: var(--tx2); }
.flyout { position: fixed; z-index: 50; min-width: 200px; padding: 4px 0; background: var(--flyout); border: 1px solid var(--flyStroke); border-radius: 8px; box-shadow: var(--shadowFly);
  animation: fly var(--slow) var(--ease) both; transform-origin: top; }
@keyframes fly { from { opacity: 0; transform: translateY(-12px) scaleY(.94); } to { opacity: 1; transform: none; } }
.flyout .it { position: relative; height: 32px; margin: 2px 4px; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 4px; transition: background var(--fast); }
.flyout .it:hover { background: var(--sub); } .flyout .it.sel::before { content: ""; position: absolute; left: 0; top: 8px; width: 3px; height: 16px; border-radius: 2px; background: var(--acc); }
.flyout .it small { margin-left: auto; color: var(--tx3); font: 400 12px "Segoe UI"; }

/* ---------- cards ---------- */
.card { display: flex; align-items: center; gap: 16px; min-height: 68px; padding: 12px 16px; background: var(--card); border: 1px solid var(--cardStroke); border-radius: 4px;
  transition: background var(--fast); }
.card.click:hover { background: var(--cardH); } .card.click:active { background: var(--card2); }
.card > svg { width: 20px; height: 20px; }
.card .txt { flex: 1; min-width: 0; } .card .d { font: 400 12px/16px "Segoe UI Variable Small", "Segoe UI"; color: var(--tx2); margin-top: 2px; }
.card .end { display: flex; align-items: center; gap: 12px; color: var(--tx2); }
.card .end > svg { width: 12px; height: 12px; }
.exp { border: 1px solid var(--cardStroke); border-radius: 4px; overflow: hidden; background: var(--card); }
.exp > .card { border: 0; border-radius: 0; background: transparent; }
.exp > .card:hover { background: var(--cardH); }
.exp .chev { width: 12px; height: 12px; transition: transform var(--norm) var(--ease); }
.exp.open .chev { transform: rotate(180deg); }
.exp .body { height: 0; overflow: hidden; transition: height var(--norm) var(--ease); }
.exp .row { display: flex; align-items: center; gap: 16px; min-height: 52px; padding: 8px 16px 8px 52px; background: var(--card2); border-top: 1px solid var(--div); }
.exp .row .txt { flex: 1; } .exp .row .d { font: 400 12px/16px "Segoe UI"; color: var(--tx2); }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 4px; font: 400 12px/16px "Segoe UI"; white-space: nowrap; }
.badge svg { width: 12px; height: 12px; }
.badge.caution { background: var(--warnBg); color: var(--tx); } .badge.caution svg { color: var(--warn); }
.badge.adv { background: var(--warn); color: #000; } [data-theme="light"] .badge.adv { color: #fff; }
.badge.ak { background: var(--sub); color: var(--tx2); border: 1px solid var(--ctlStroke); }

/* hero (Home) */
.hero { position: relative; display: flex; align-items: center; gap: 24px; padding: 24px; border-radius: 8px; background: var(--card); border: 1px solid var(--cardStroke); overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -80px; top: -120px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(closest-side, var(--accSoft), transparent); pointer-events: none; }
.hero img { width: 76px; height: 76px; object-fit: contain; }
.hero h1 { margin: 0; font: 600 28px/36px "Segoe UI Variable Display", "Segoe UI"; }
.hero .facts { margin-left: auto; display: grid; grid-template-columns: auto auto; gap: 2px 14px; padding-left: 24px; border-left: 1px solid var(--div); position: relative; z-index: 1; }
.hero .facts b { font: 600 20px/28px "Segoe UI Variable Display", "Segoe UI"; text-align: right; } .hero .facts span { color: var(--tx2); font: 400 12px/28px "Segoe UI"; white-space: nowrap; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { position: relative; text-align: left; display: flex; flex-direction: column; gap: 6px; min-height: 152px; padding: 16px; border-radius: 8px; background: var(--card);
  border: 1px solid var(--cardStroke); transition: background var(--fast), transform var(--norm) var(--ease), box-shadow var(--norm); }
.tile:hover { background: var(--cardH); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,.18); }
.tile:active { transform: translateY(0) scale(.99); }
.tile .ico { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: var(--accSoft); color: var(--accTx); margin-bottom: 4px; }
.tile .ico svg { width: 20px; height: 20px; }
.tile b { font-weight: 600; } .tile .tf { margin-top: auto; color: var(--accTx); font: 400 12px "Segoe UI"; display: flex; align-items: center; gap: 6px; }
.tile.rec { border-color: var(--acc); }

/* InfoBar */
.info { display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 4px; border: 1px solid var(--cardStroke); background: var(--infoBg); overflow: hidden;
  max-height: 0; opacity: 0; margin-bottom: 0; transition: max-height var(--slow) var(--ease), opacity var(--norm), margin var(--slow) var(--ease), padding var(--slow) var(--ease); }
.info.show { max-height: 80px; opacity: 1; padding: 12px 16px; margin-bottom: 16px; }
.info > svg { width: 16px; height: 16px; color: var(--accTx); }
.info.warn { background: var(--warnBg); } .info.warn > svg { color: var(--warn); }
.info.ok { background: var(--okBg); } .info.ok > svg { color: var(--ok); }
.info .t { flex: 1; } .info b { font-weight: 600; margin-right: 8px; }

/* progress */
.ring { width: 16px; height: 16px; } .ring circle { fill: none; stroke: var(--acc); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 30 100; transform-origin: center; animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.bar { position: relative; height: 3px; border-radius: 2px; overflow: hidden; }
.bar::before { content: ""; position: absolute; left: 0; right: 0; top: 1px; height: 1px; background: var(--strong); }
.bar i { position: absolute; left: 0; top: 0; height: 3px; border-radius: 2px; background: var(--acc); transition: width var(--slow) var(--ease); }
.bar.indet i { width: 35%; animation: indet 1.6s var(--easeIO) infinite; }
@keyframes indet { from { left: -35%; } to { left: 100%; } }

/* footer for Guided */
.foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 16px 36px; background: var(--mica); border-top: 1px solid var(--div);
  transform: translateY(100%); transition: transform var(--slow) var(--ease); z-index: 4; }
.foot.show { transform: none; }
.foot .bar { width: 160px; }
.foot .right { margin-left: auto; display: flex; gap: 8px; }

/* downloads grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.app { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 8px; background: var(--card); border: 1px solid var(--cardStroke); transition: background var(--fast); }
.app:hover { background: var(--cardH); }
.app .ic { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; color: #fff; font: 600 16px "Segoe UI Variable Display", "Segoe UI"; flex: none; }
.app .n { flex: 1; min-width: 0; } .app .n b { display: block; font-weight: 400; } .app .n span { font: 400 12px "Segoe UI"; color: var(--tx2); }
.app .act { width: 92px; display: flex; justify-content: flex-end; }
.done { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); font: 400 12px "Segoe UI"; animation: pop var(--slow) var(--ease) both; }
@keyframes pop { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: none; } }

/* radio list */
.radios { display: flex; flex-direction: column; gap: 10px; padding: 4px 0; }
.rad { display: flex; align-items: center; gap: 8px; user-select: none; }
.dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--strong); background: var(--ctlP); display: grid; place-items: center; transition: background var(--fast), border-color var(--fast); }
.dot::after { content: ""; width: 0; height: 0; border-radius: 50%; background: var(--accT); transition: width var(--norm) var(--ease), height var(--norm) var(--ease); }
.rad:hover .dot { background: var(--ctlH); } .rad.on .dot { background: var(--acc); border-color: var(--acc); } .rad.on .dot::after { width: 10px; height: 10px; }
.rad.on:hover .dot::after { width: 12px; height: 12px; }

/* dialog */
.smoke { position: absolute; inset: 0; background: var(--smoke); z-index: 20; display: grid; place-items: center; animation: fade var(--norm) linear both; }
.smoke.out { animation: fadeOut var(--norm) linear both; }
@keyframes fade { from { opacity: 0; } } @keyframes fadeOut { to { opacity: 0; } }
.dlg { width: 448px; background: var(--flyout); border: 1px solid var(--flyStroke); border-radius: 8px; box-shadow: var(--shadowDlg); overflow: hidden; animation: dlgIn var(--slow) var(--ease) both; }
.smoke.out .dlg { animation: dlgOut var(--norm) var(--easeIO) both; }
@keyframes dlgIn { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: none; } }
@keyframes dlgOut { to { opacity: 0; transform: scale(1.05); } }
.dlg .b { padding: 24px; } .dlg h3 { margin: 0 0 12px; font: 600 20px/28px "Segoe UI Variable Display", "Segoe UI"; }
.dlg ul { margin: 8px 0 0; padding-left: 20px; color: var(--tx2); }
.dlg .f { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 24px; background: var(--mica); border-top: 1px solid var(--div); }
.dlg .f .btn { min-width: 0; }

/* toast */
.toast { position: absolute; right: 20px; bottom: 20px; z-index: 30; display: flex; gap: 12px; align-items: flex-start; width: 340px; padding: 14px 16px; background: var(--flyout);
  border: 1px solid var(--flyStroke); border-radius: 8px; box-shadow: var(--shadowFly); animation: toastIn var(--page) var(--ease) both; }
.toast.out { animation: toastOut var(--norm) var(--easeIO) both; }
.toast img { width: 20px; }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } } @keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }

/* tooltip */
.tip { position: fixed; z-index: 60; padding: 6px 8px 8px; max-width: 280px; font: 400 12px/16px "Segoe UI"; background: var(--flyout); color: var(--tx); border: 1px solid var(--flyStroke);
  border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,.2); pointer-events: none; animation: fade var(--norm) linear both; }

.note { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); font: 400 12px "Segoe UI"; color: rgba(255,255,255,.6); }
[data-theme="light"] .note { color: rgba(0,0,0,.5); }

/* ===== additions for the full prototype ===== */
.mono-ic { filter: none; } [data-theme="light"] .mono-ic { filter: invert(1) brightness(.15); }
.appic { width: 40px; height: 40px; border-radius: 8px; object-fit: contain; flex: none; }
.appic.sm { width: 28px; height: 28px; border-radius: 6px; }
.ph { width: 40px; height: 40px; border-radius: 8px; flex: none; display: grid; place-items: center; background: var(--sub); color: var(--tx2); }
.ph.sm { width: 28px; height: 28px; border-radius: 6px; }
.lead { color: var(--tx2); margin: -12px 0 20px; max-width: 760px; }

/* SelectorBar (WinUI) with a sliding underline */
.selbar { position: relative; display: flex; gap: 4px; margin: 0 0 16px; }
.selbar button { position: relative; height: 40px; padding: 0 12px; border-radius: 4px; color: var(--tx2); transition: background var(--fast), color var(--fast); }
.selbar button:hover { background: var(--sub); color: var(--tx); }
.selbar button.on { color: var(--tx); font-weight: 600; }
.selbar .ul { position: absolute; bottom: 2px; height: 3px; border-radius: 2px; background: var(--acc); transition: left var(--slow) var(--ease), width var(--slow) var(--ease); }

/* command bar */
.cmdbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.cmdbar .grow { flex: 1; }

/* AutoSuggestBox flyout */
.suggest { position: fixed; z-index: 55; width: 360px; max-height: 420px; overflow: auto; padding: 4px 0; background: var(--flyout); border: 1px solid var(--flyStroke);
  border-radius: 8px; box-shadow: var(--shadowFly); animation: fly var(--slow) var(--ease) both; transform-origin: top; }
.suggest .it { display: flex; align-items: center; gap: 12px; margin: 2px 4px; padding: 8px 12px; border-radius: 4px; transition: background var(--fast); }
.suggest .it:hover, .suggest .it.hi { background: var(--sub); }
.suggest .it .t { flex: 1; min-width: 0; } .suggest .it .t div { font: 400 12px/16px "Segoe UI"; color: var(--tx3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.suggest .more { padding: 8px 16px; color: var(--accTx); font: 400 12px "Segoe UI"; }
mark { background: transparent; color: var(--accTx); font-weight: 600; }

/* skeleton while States load */
.sk { border-radius: 4px; background: var(--card); border: 1px solid var(--cardStroke); height: 68px; position: relative; overflow: hidden; }
.sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, var(--sub), transparent); animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }

/* teaching tip */
.ttip { position: fixed; z-index: 58; width: 300px; padding: 16px; background: var(--flyout); border: 1px solid var(--flyStroke); border-radius: 8px; box-shadow: var(--shadowFly);
  animation: fly var(--slow) var(--ease) both; }
.ttip::before { content: ""; position: absolute; left: -7px; top: 18px; width: 12px; height: 12px; background: var(--flyout); border-left: 1px solid var(--flyStroke); border-bottom: 1px solid var(--flyStroke); transform: rotate(45deg); }
.ttip b { display: block; font-weight: 600; margin-bottom: 4px; }
.ttip .acts { display: flex; justify-content: flex-end; margin-top: 12px; }

/* chooser tiles (Install AkariOS) */
.choose { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choose .tile { min-height: 200px; padding: 20px; }
.choose .tile .ico { width: 48px; height: 48px; } .choose .tile .ico svg { width: 24px; height: 24px; }
.choose .tile b { font: 600 20px/28px "Segoe UI Variable Display", "Segoe UI"; }
.phases { display: flex; flex-direction: column; }
.phase { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.phase + .phase { border-top: 1px solid var(--div); }
.phase .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accSoft); color: var(--accTx); font: 600 12px "Segoe UI"; flex: none; }

/* step header (Guided) */
.steps { display: flex; align-items: center; gap: 8px; margin: -8px 0 20px; color: var(--tx2); font: 400 12px "Segoe UI"; }
.steps .s { display: flex; align-items: center; gap: 8px; }
.steps .s i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--strong); font: 600 11px "Segoe UI"; font-style: normal; transition: background var(--norm), border-color var(--norm), color var(--norm); }
.steps .s.cur { color: var(--tx); } .steps .s.cur i { background: var(--acc); border-color: var(--acc); color: var(--accT); }
.steps .s.done i { background: var(--accSoft); border-color: transparent; color: var(--accTx); }
.steps .ln { width: 32px; height: 1px; background: var(--div); }

/* summary cards (Review) */
.sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.sum .c { padding: 16px; border-radius: 8px; background: var(--card); border: 1px solid var(--cardStroke); }
.sum .c b { display: block; font: 600 28px/36px "Segoe UI Variable Display", "Segoe UI"; }
.sum .c span { color: var(--tx2); font: 400 12px "Segoe UI"; }

/* run list */
.runrow { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 16px; border-top: 1px solid var(--div); }
.runrow:first-child { border-top: 0; }
.runrow .st { width: 92px; display: flex; justify-content: flex-end; align-items: center; gap: 6px; font: 400 12px "Segoe UI"; color: var(--tx3); }
.runrow .st.ok { color: var(--ok); } .runrow .st.bad { color: var(--bad); } .runrow .st.skip { color: var(--tx3); }
.runrow .st svg { width: 14px; height: 14px; }
.runbox { border: 1px solid var(--cardStroke); border-radius: 4px; background: var(--card); overflow: hidden; }
.bigbar { margin: 4px 0 20px; }
.bigbar .bar { height: 3px; }
.bigbar .lbl { display: flex; justify-content: space-between; color: var(--tx2); font: 400 12px "Segoe UI"; margin-bottom: 8px; }

/* section cards on Optimize */
.secgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }

/* Install USB */
.usbbar { display: flex; align-items: center; gap: 8px; padding: 16px; border-radius: 8px; background: var(--card); border: 1px solid var(--cardStroke); margin-bottom: 20px; }
.field { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; }
.field label { font: 400 14px "Segoe UI"; }
.field .input { max-width: 320px; }
.acct { display: grid; grid-template-columns: 1fr 1fr 140px 32px; gap: 8px; align-items: center; }
.acct .input { padding-right: 11px; }

/* InfoBar close */
.info .x { width: 32px; height: 32px; border-radius: 4px; display: grid; place-items: center; color: var(--tx2); margin-right: -8px; }
.info .x:hover { background: var(--sub); }

/* list rows (apps to remove) */
.lrow { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; background: var(--card); border: 1px solid var(--cardStroke); border-radius: 4px; transition: background var(--fast); }
.lrow:hover { background: var(--cardH); }
.lrow .t { flex: 1; min-width: 0; } .lrow .t .d { font: 400 12px/16px "Segoe UI"; color: var(--tx2); }
.lrow.sel { background: var(--accSoft); }

/* hyperlink button row */
.links { display: flex; gap: 16px; flex-wrap: wrap; }

/* small screens of the window */
.win.compact .ni { gap: 0; }
.win.compact .ni > :not(svg) { opacity: 0; }
.win.compact .navfoot .ni, .win.compact .items > .ni { width: 40px; }
.empty { text-align: center; padding: 48px 0; color: var(--tx2); }
.empty svg { width: 40px; height: 40px; color: var(--tx3); margin-bottom: 12px; }
.kbd { font: 400 11px "Segoe UI"; color: var(--tx3); border: 1px solid var(--ctlStroke2); border-radius: 4px; padding: 1px 5px; position: absolute; right: 30px; top: 7px; }
.input:focus ~ .kbd { display: none; }

.win.max { inset: 0 !important; width: auto !important; height: auto !important; border-radius: 0 !important; }
.kids .ni svg.i { width: 16px; height: 16px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.secgrid .card .end .cap, .stack .card .end .cap { color: var(--tx3); }
/* compact */ .win.compact .ni .lb, .win.compact .ni .chev { opacity: 0; } .ni .lb { transition: opacity var(--fast); }
.field .combo { max-width: 360px; }
.tog.mixed .thumb { transform: translateX(10px); }

<script>
/* AkariOS prototype: every page and flow, WinUI 3 look and motion. Data comes from the real repo (src/Tweaks, Apps/Remove, Assets/Apps, About.psd1). */
const D = {"tweaks": [{"id": "display-composed-independent-flip", "sec": "Advanced", "cat": "Display", "name": "Hardware composed independent flip", "d": "Windowed games flip right away (ForceFlipTrueImmediateMode) instead of the default hardware independent flip.", "risk": "Caution", "kind": "Toggle", "reboot": true, "ak": false, "safe": false, "choice": null}, {"id": "display-fullscreen-exclusive", "sec": "Advanced", "cat": "Display", "name": "Fullscreen exclusive (hardware legacy flip)", "d": "Fullscreen games run in real exclusive mode instead of fullscreen optimizations. Alt-Tab gets slower.", "risk": "Caution", "kind": "Toggle", "reboot": false, "ak": false, "safe": false, "choice": null}, {"id": "display-mpo-off", "sec": "Advanced", "cat": "Display", "name": "Turn off multiplane overlay (MPO)", "d": "Fixes flicker, black screens and stutter some GPUs get with MPO, at a little extra GPU work.", "risk": "Caution", "kind": "Toggle", "reboot": true, "ak": false, "safe": false, "choice": null}, {"id": "security-dep-off", "sec": "Advanced", "cat": "Security", "name": "Turn off Data Execution Prevention", "d": "Sets DEP to AlwaysOff for every program. Some old games need it; Windows is less safe without it.", "risk": "Advanced", "kind": "Toggle", "reboot": true, "ak": false, "safe": false, "choice": null}, {"id": "security-defender-off", "sec": "Advanced", "cat": "Security", "name": "Microsoft Defender off completely", "d": "Real-time protection, the Defender services and drivers, SmartScreen, its right-click entry and the Windows Security tray icon off: no antivirus at all. Pair it with \"Windows Security: protections and notifications off\". Needs Safe Mode: Akari restarts into it and back.", "risk": "Advanced", "kind": "Toggle", "reboot": true, "ak": false, "safe": true, "choice": null}, {"id": "security-defender-settings", "sec": "Advanced", "cat": "Security", "name": "Windows Security: protections and notifications off", "d": "Tamper, cloud and ransomware protection, Smart App Control, SmartScreen, phishing protection, exploit protection, memory integrity, LSA protection and the driver blocklist off; no security notifications. Needs Safe Mode: Akari restarts into it and back.", "risk": "Advanced", "kind": "Toggle", "reboot": true, "ak": true, "safe": true, "choice": null}, {"id": "security-defender-tasks-off", "sec": "Advanced", "cat": "Security", "name": "No Defender scheduled scans, no SmartScreen for apps", "d": "Defender's scheduled scan, cleanup, verification and cache tasks off; SmartScreen off for Edge and Store apps.", "risk": "Caution", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "security-download-warning-off", "sec": "Advanced", "cat": "Security", "name": "No security warning on downloaded files", "d": "Files from the internet open without the \"Open File - Security Warning\" prompt.", "risk": "Caution", "kind": "Toggle", "reboot": false, "ak": false, "safe": false, "choice": null}, {"id": "svchost-split-threshold", "sec": "Advanced", "cat": "Tuning", "name": "SvcHost split threshold", "d": "How many svchost.exe processes Windows creates. Merging them saves memory, but one crash takes more services down.", "risk": "Safe", "kind": "Choice", "reboot": true, "ak": false, "safe": false, "choice": [["Per memory size (Windows default)", "One process per service group", "Merge all services"], null, "Per memory size (Windows default)"]}, {"id": "win32-priority-separation", "sec": "Advanced", "cat": "Tuning", "name": "Win32 Priority Separation", "d": "Short, variable quanta with a 3:1 foreground boost (0x26).", "risk": "Safe", "kind": "Choice", "reboot": true, "ak": true, "safe": false, "choice": [["0x26 short, variable, 3:1", "0x28 short, fixed", "0x18 long, fixed, 3:1", "0x2 Windows default"], "0x26 short, variable, 3:1", "0x2 Windows default"]}, {"id": "graphics-amd-settings", "sec": "Hardware", "cat": "Graphics", "name": "AMD settings", "d": "FR33THY's AMD Software setup: Anti-Lag on, VSync off, performance texture filtering, tessellation off, Vari-Bright off; no overlay, hotkeys, ads, tray or update checks.", "risk": "Caution", "kind": "Toggle", "reboot": false, "ak": false, "safe": false, "choice": null}, {"id": "graphics-amd-ulps-off", "sec": "Hardware", "cat": "Graphics", "name": "Turn off AMD ULPS", "d": "Stops AMD's Ultra Low Power State, which can cause stutter, black screens and wake problems (more idle power).", "risk": "Caution", "kind": "Toggle", "reboot": true, "ak": false, "safe": false, "choice": null}, {"id": "graphics-hdcp-off", "sec": "Hardware", "cat": "Graphics", "name": "Turn off HDCP (NVIDIA)", "d": "Turns off HDCP copy protection on the GPU. Protected video (Netflix and other streaming apps) may stop playing.", "risk": "Caution", "kind": "Toggle", "reboot": true, "ak": false, "safe": false, "choice": null}, {"id": "gaming-capture-off", "sec": "Optimize", "cat": "Gaming", "name": "Game Bar captures off", "d": "No background recording, no capture shortcuts (Win+Alt+R and the rest), no microphone or cursor in captures.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "disable-game-dvr", "sec": "Optimize", "cat": "Gaming", "name": "Disable Game DVR", "d": "Turns off background game recording.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "gaming-dvr-policy-off", "sec": "Optimize", "cat": "Gaming", "name": "Block game recording by policy", "d": "Group policy turns off Windows game recording and broadcasting for every user, so Game Bar captures can't be switched back on.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": false, "safe": false, "choice": null}, {"id": "gaming-game-mode", "sec": "Optimize", "cat": "Gaming", "name": "Game Mode on", "d": "Windows gives the game you play priority and pauses updates while it runs.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "gaming-hags", "sec": "Optimize", "cat": "Gaming", "name": "Hardware-accelerated GPU scheduling", "d": "The graphics card schedules its own work (lower latency on recent GPUs and drivers).", "risk": "Safe", "kind": "Toggle", "reboot": true, "ak": true, "safe": false, "choice": null}, {"id": "gaming-no-xbox-full-screen", "sec": "Optimize", "cat": "Gaming", "name": "No Xbox full screen experience", "d": "The Xbox app isn't used as a full screen home for games (the handheld \"Xbox mode\"), so Windows boots to the normal desktop.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": false, "safe": false, "choice": null}, {"id": "gaming-open-game-mode", "sec": "Optimize", "cat": "Gaming", "name": "Game Mode settings", "d": "Opens Settings > Gaming > Game Mode.", "risk": "Safe", "kind": "Action", "reboot": false, "ak": false, "safe": false, "choice": null}, {"id": "gaming-presence-writer-off", "sec": "Optimize", "cat": "Gaming", "name": "Game Bar presence writer off", "d": "GameBarPresenceWriter.exe no longer starts with every game to tell Xbox what you play.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "gaming-windowed-optimizations", "sec": "Optimize", "cat": "Gaming", "name": "Optimizations for windowed games", "d": "Windowed and borderless games present like fullscreen ones (lower latency); variable refresh rate stays as the game sets it.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "gaming-xbox-controller-no-game-bar", "sec": "Optimize", "cat": "Gaming", "name": "Controller Xbox button doesn't open Game Bar", "d": "The Xbox button and View + Menu no longer open Game Bar, and no \"get an app\" pop-up appears when the Xbox apps are removed.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "network-block-razer-asus", "sec": "Optimize", "cat": "Network", "name": "Block Razer and ASUS download servers", "d": "Razer Synapse and ASUS Armoury Crate can't download their apps, updates or ads, or sign in, so their installers (also the ones a new Razer or ASUS device starts) get nowhere. Undo this before using those apps.", "risk": "Caution", "kind": "Toggle", "reboot": false, "ak": false, "safe": false, "choice": null}, {"id": "network-dns", "sec": "Optimize", "cat": "Network", "name": "DNS server", "d": "The DNS servers of every network adapter (Ethernet and Wi-Fi), IPv4 and IPv6. On Windows 11 the lookups are also encrypted (DNS over HTTPS). Automatic uses your router's or provider's.", "risk": "Caution", "kind": "Choice", "reboot": false, "ak": false, "safe": false, "choice": [["Cloudflare", "Cloudflare, blocks malware", "Cloudflare, blocks malware and adult sites", "Google", "Quad9", "OpenDNS", "AdGuard, blocks ads and trackers", "Automatic (DHCP)"], "Cloudflare", "Automatic (DHCP)"]}, {"id": "network-ipv4-only", "sec": "Optimize", "cat": "Network", "name": "IPv4 only", "d": "Adapters keep only IPv4: no IPv6, file and printer sharing, network discovery or QoS. Shared folders on this PC and others stop working.", "risk": "Caution", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "network-no-ics-control", "sec": "Optimize", "cat": "Network", "name": "Others can't control a shared connection", "d": "Other network users can't turn off or change an Internet connection you share.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "performance-background-apps-off", "sec": "Optimize", "cat": "Performance", "name": "Background apps off", "d": "Store apps don't run in the background (they still notify when open); the Widgets board and touch keyboard don't preload.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "performance-bitlocker-off", "sec": "Optimize", "cat": "Performance", "name": "Decrypt BitLocker drives", "d": "Turns BitLocker off and decrypts every encrypted drive in the background (faster disk access). Turn it back on in BitLocker settings.", "risk": "Caution", "kind": "Action", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "performance-clean-temp", "sec": "Optimize", "cat": "Performance", "name": "Clean temporary files", "d": "Empties the temp folders and the Windows Update download cache, deletes Windows.old, PerfLogs and crash logs, then runs Disk Cleanup.", "risk": "Safe", "kind": "Action", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "performance-defrag-schedule-off", "sec": "Optimize", "cat": "Performance", "name": "No scheduled drive optimization", "d": "Drives are optimized only when you run it yourself.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "performance-icon-cache", "sec": "Optimize", "cat": "Performance", "name": "Bigger icon cache", "d": "Explorer keeps up to 4096 icons in memory instead of 500, so folders with many files show their icons faster.", "risk": "Safe", "kind": "Toggle", "reboot": true, "ak": false, "safe": false, "choice": null}, {"id": "performance-last-access-off", "sec": "Optimize", "cat": "Performance", "name": "Don't update last access times", "d": "NTFS stops writing the \"last accessed\" date every time a file is read: fewer disk writes. Few programs use that date.", "risk": "Safe", "kind": "Toggle", "reboot": true, "ak": false, "safe": false, "choice": null}, {"id": "performance-maintenance-off", "sec": "Optimize", "cat": "Performance", "name": "Automatic maintenance off", "d": "No nightly maintenance (scans, defrag, diagnostics) waking the PC or running while you play.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "power-device-power-saving-off", "sec": "Optimize", "cat": "Power", "name": "Device power saving and wake off", "d": "Devices (mouse, keyboard, USB, PCI) never power down to save energy and can't wake the PC. Wake by the power button only.", "risk": "Caution", "kind": "Toggle", "reboot": true, "ak": true, "safe": false, "choice": null}, {"id": "power-fast-startup-off", "sec": "Optimize", "cat": "Power", "name": "Fast startup off", "d": "Shut down really shuts down: drivers and Windows start fresh every time.", "risk": "Safe", "kind": "Toggle", "reboot": true, "ak": true, "safe": false, "choice": null}, {"id": "power-hibernate-off", "sec": "Optimize", "cat": "Power", "name": "Hibernate off", "d": "No hibernation: frees the disk space of hiberfil.sys (the size of your RAM). Also turns off fast startup.", "risk": "Safe", "kind": "Toggle", "reboot": true, "ak": true, "safe": false, "choice": null}, {"id": "power-hide-lock-sleep", "sec": "Optimize", "cat": "Power", "name": "No Lock and Sleep in the power menu", "d": "The power menu shows only shut down and restart.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "power-network-adapter-power-saving-off", "sec": "Optimize", "cat": "Power", "name": "Network adapter power saving and wake off", "d": "Network adapters never power down, no Energy-Efficient Ethernet or green modes, no Wake-on-LAN.", "risk": "Safe", "kind": "Toggle", "reboot": true, "ak": true, "safe": false, "choice": null}, {"id": "privacy-activity-history", "sec": "Optimize", "cat": "Privacy", "name": "Activity history off", "d": "Windows stops keeping a history of the apps and files you use.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "privacy-ads", "sec": "Optimize", "cat": "Privacy", "name": "No ads and suggestions", "d": "No suggested apps installed silently, no tips, no ads in Settings and on the lock screen, no \"finish setting up\" nags, no language-based web content.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "privacy-app-permissions", "sec": "Optimize", "cat": "Privacy", "name": "Block app permissions", "d": "Apps can't read your contacts, calendar, call history, email, messages, documents, pictures, music, videos or files, or use radios and Windows AI models. Camera and microphone stay allowed.", "risk": "Caution", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "privacy-camera-deny", "sec": "Optimize", "cat": "Privacy", "name": "Block apps from the camera", "d": "Turns off camera access for every app (Settings > Privacy > Camera). Video calls, streaming and Windows Hello face sign-in stop working until you turn it back on.", "risk": "Caution", "kind": "Toggle", "reboot": false, "ak": false, "safe": false, "choice": null}, {"id": "privacy-consumer-features", "sec": "Optimize", "cat": "Privacy", "name": "No consumer features", "d": "Group policy stops Windows installing suggested apps and games for new accounts. Full effect on Enterprise and Education; Pro honours part of it.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": false, "safe": false, "choice": null}, {"id": "privacy-copilot-ai", "sec": "Optimize", "cat": "Privacy", "name": "Copilot and AI off", "d": "Turns off Copilot, Recall, Click to Do, and the AI features of Paint and Notepad (policies).", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": true, "safe": false, "choice": null}, {"id": "privacy-copilot-key-off", "sec": "Optimize", "cat": "Privacy", "name": "Copilot key and taskbar companion off", "d": "The Copilot key on newer keyboards opens nothing, and the taskbar's AI companion stays hidden.", "risk": "Safe", "kind": "Toggle", "reboot": false, "ak": false, "safe": false, "choice": null}, {"id": "privacy-device-usage-off", "sec": "Optimize", "cat": "Privacy", "name": "Forget how you use this PC", "d": "Clears the \"device usage\" answers from setup (gaming, school, creativity, business and more) that Windows uses for tips, ads and suggestions.", "risk": "A const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const EASE = 'cubic-bezier(0,0,0,1)';
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.anim === 'off';
const ic = (n, v = 'regular', cls = 'i') => `<svg class="${cls}" viewBox="0 0 20 20" aria-hidden="true">${ICONS[n + ':' + v] || ICONS['settings:regular']}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
$$('img[data-logo]').forEach(i => i.src = i.dataset.logo === 'd' ? LD : LL);
const logo = (w, extra = '') => `<img class="logo-d" src="${LD}" style="width:${w}px" alt="" ${extra}><img class="logo-l" src="${LL}" style="width:${w}px" alt="" ${extra}>`;
const appIcon = (key, mono, sm) => key && D.icons[key] ? `<img class="appic${sm ? ' sm' : ''}${mono ? ' mono-ic' : ''}" src="${D.icons[key]}" alt="">` : `<span class="ph${sm ? ' sm' : ''}">${ic('box')}</span>`;

/* ---------- catalogue ---------- */
const SECTIONS = ['Optimize', 'Customize', 'Hardware', 'Advanced', 'Tools'];
const SEC_ICON = { Optimize: 'top_speed', Customize: 'paint_brush', Hardware: 'developer_board', Advanced: 'shield', Tools: 'toolbox' };
const CAT_ICON = { Gaming: 'games', Performance: 'top_speed', Power: 'power', Privacy: 'eye_off', Network: 'globe', Update: 'arrow_sync', Security: 'shield', Display: 'desktop',
  Tuning: 'developer_board', Graphics: 'desktop', Input: 'keyboard', Accessibility: 'accessibility', Apps: 'apps', 'Context menu': 'text_bullet_list', Explorer: 'folder',
  Notifications: 'alert', Sound: 'speaker_2', Start: 'grid', System: 'window', Taskbar: 'panel_bottom', Theme: 'paint_brush', Features: 'apps', 'Scheduled tasks': 'calendar',
  Services: 'settings', Check: 'checkmark_circle', Cleanup: 'broom', Drivers: 'arrow_download', Fixes: 'wrench', Panels: 'window', Refresh: 'arrow_reset', Setup: 'rocket' };
const words = id => id.replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/([A-Z])([A-Z][a-z])/g, '$1 $2').replace(/^./, c => c.toUpperCase()).replace(/ ([A-Z])([a-z])/g, (m, a, b) => ' ' + a.toLowerCase() + b);
// every Tweak: the 50 read from the repo in full, the rest by name from its file
const TW = [];
const known = new Set(D.tweaks.map(t => t.sec + '/' + t.cat + '/' + t.id));
D.tweaks.filter(t => t.id !== 'svchost-split-threshold').forEach(t => TW.push({ ...t, full: true }));
Object.entries(D.catalog).forEach(([k, files]) => {
  const [sec, cat] = k.split('/'); if (!SECTIONS.includes(sec)) return;
  const have = D.tweaks.filter(t => t.sec === sec && t.cat === cat).length;
  files.slice(have).forEach(f => TW.push({ id: f.toLowerCase(), sec, cat, name: words(f), d: '', risk: 'Safe', kind: sec === 'Tools' ? 'Action' : (/^Open/.test(f) ? 'Action' : 'Toggle'), full: false }));
});
const ST = {}; // live state per Tweak: true / false / 'mixed' / choice label
TW.forEach((t, i) => { ST[t.id] = t.choice ? t.choice[2] : (t.id === 'privacy-device-usage-off' ? 'mixed' : (t.ak && i % 3 === 0)); });
const cats = sec => [...new Set(TW.filter(t => t.sec === sec).map(t => t.cat))];

/* ---------- app state ---------- */
const S = {
  page: 'home', arg: null, history: [], firstRun: true, restart: new Set(), safeQueue: new Set(), activity: [],
  flow: null, step: 0,                               // Install AkariOS: null (chooser) | 'guided' | 'run' | 'result'
  gRemove: new Set(D.appx.filter(a => a.risk === 'Safe').slice(0, 8).map(a => a.id)),
  gInstall: new Set(['steam', 'discord', '7zip']),
  gTweaks: new Set(TW.filter(t => t.full && t.ak && t.sec === 'Optimize' && t.kind !== 'Action').map(t => t.id)),
  dl: { filter: 'All', q: '', installed: new Set(['terminal']), busy: new Set() },
  rm: { tab: 'Store apps', sel: new Set(), gone: new Set() },
  usb: { drive: null }, run: null,
};

/* ---------- small renderers ---------- */
const badge = t => t.risk === 'Advanced' ? `<span class="badge adv">Advanced</span>` : t.risk === 'Caution' ? `<span class="badge caution">${ic('warning', 'filled')}Caution</span>` : '';
const akBadge = t => t.ak ? `<span class="badge ak">AkariOS</span>` : '';
const toggle = (state, id) => {
  const on = state === true, mixed = state === 'mixed';
  return `<button class="tog${on ? ' on' : ''}${mixed ? ' mixed' : ''}" data-tog="${id}" role="switch" aria-checked="${mixed ? 'mixed' : on}"><span class="lbl">${mixed ? 'Unchanged' : on ? 'On' : 'Off'}</span><span class="track"><span class="thumb"></span></span></button>`;
};
const check = (on, id, label = '') => `<button class="chk${on ? ' on' : ''}" data-chk="${id}" role="checkbox" aria-checked="${on}"><span class="box"><svg viewBox="0 0 12 12"><path class="tick" d="M2.5 6.2 5 8.6 9.6 3.6"/></svg></span>${label}</button>`;
const combo = (id, value) => `<button class="combo" data-combo="${id}">${esc(value)}${ic('chevron_down')}</button>`;
const crumbs = (...p) => `<div class="head">${p.map((x, i) => i < p.length - 1 ? `<button class="crumb" data-go="${x[1]}" data-arg="${x[2] || ''}">${x[0]}</button>${ic('chevron_right')}` : `<span>${x}</span>`).join('')}</div>`;
const marks = t => `${t.reboot ? `<span data-tip="Restart required" style="display:flex">${ic('arrow_clockwise')}</span>` : ''}${t.safe ? `<span data-tip="Runs in Safe Mode: Akari restarts into it and back" style="display:flex">${ic('power')}</span>` : ''}`;
function control(t) {
  if (t.kind === 'Action') return `<button class="btn" data-action="${t.id}">${/^Open|settings$/i.test(t.name) || /^Opens/.test(t.d) ? 'Open' : 'Run'}</button>`;
  if (t.choice) return combo('tw:' + t.id, ST[t.id]);
  return toggle(ST[t.id], t.id);
}
const tweakCard = (t, q) => `<div class="card" data-row="${t.id}">${ic(CAT_ICON[t.cat] || 'settings')}<div class="txt">${hl(t.name, q)}${t.d || t.full ? `<div class="d">${hl(t.d, q)} <span class="mono">${t.id}</span></div>` : ''}</div><div class="end">${akBadge(t)}${badge(t)}${marks(t)}${control(t)}</div></div>`;
const hl = (s, q) => !q ? esc(s) : esc(s).replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
const info = (kind, icon, title, text, extra = '', id = '') => `<div class="info show ${kind}"${id ? ` id="${id}"` : ''}>${ic(icon, 'filled')}<div class="t"><b>${title}</b><span class="t2">${text}</span></div>${extra}</div>`;
const expander = (icon, h, d, body, open, end = '') => `<div class="exp${open ? ' open' : ''}" style="margin-bottom:4px"><div class="card" data-exp role="button" tabindex="0" aria-expanded="${!!open}" style="cursor:default">${ic(icon)}<div class="txt">${h}<div class="d">${d}</div></div><div class="end">${end}${ic('chevron_down', 'regular', 'i chev')}</div></div><div class="body" style="height:${open ? 'auto' : '0'}">${body}</div></div>`;
const selbar = (name, items, cur) => `<div class="selbar" data-sel="${name}">${items.map(x => `<button class="${x === cur ? 'on' : ''}" data-selv="${esc(x)}">${esc(x)}</button>`).join('')}<span class="ul"></span></div>`;

/* ---------- pages ---------- */
const PAGES = {};

  const applied = S.activity.reduce((n, a) => n + a.n, 0);
  return `${S.updateDismissed ? '' : info('', 'info', 'AkariOS 1.2.1 is available', 'Fixes and three new Tweaks.', `<button class="btn" data-act="update">Update</button><button class="x" data-act="dismiss-update" title="Close">${ic('dismiss')}</button>`, 'upd')}
  <div class="hero">${logo(76)}
    <div style="position:relative;z-index:1"><h1>Windows, tuned for games</h1><div class="t2">Debloat and optimize Windows in one click, or pick every change yourself.</div>
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn acc" data-act="oneclick">${ic('flash')}Start One-click</button><button class="btn" data-go="install" data-arg="guided">Choose changes</button></div></div>
    <div class="facts"><b>${D.counts.tweaks}</b><span>Tweaks</span><b>${D.counts.removable}</b><span>Apps you can remove</span><b>${applied}</b><span>Changes applied</span></div></div>
  <div class="sect">Get started</div>
  <div class="tiles">
    <button class="tile rec" data-act="oneclick"><span class="ico">${ic('flash')}</span><b>One-click</b><span class="cap t2">The full AkariOS setup: apps, drivers, Safe Mode and tweaks, with restarts handled for you.</span><span class="tf">Recommended for a fresh install</span></button>
    <button class="tile" data-go="install" data-arg="guided"><span class="ico">${ic('wand')}</span><b>Guided</b><span class="cap t2">Pick the apps to remove and the Tweaks to apply, review, then apply in one go.</span><span class="tf">For a PC you already use</span></button>
    <button class="tile" data-go="optimize"><span class="ico">${ic('options')}</span><b>Optimize</b><span class="cap t2">Every Tweak by category. Each change applies the moment you flip it.</span><span class="tf">For power users</span></button>
  </div>
  <div class="sect">Quick settings</div>
  <div class="stack">${['disable-game-dvr', 'gaming-game-mode', 'performance-background-apps-off', 'privacy-ads'].map(id => tweakCard(TW.find(t => t.id === id))).join('')}</div>
  <div class="sect">Recent activity</div>
  ${S.activity.length ? `<div class="stack">${S.activity.slice(0, 5).map(a => `<div class="card">${ic(a.icon)}<div class="txt">${a.title}<div class="d">${a.when}</div></div><div class="end"><span class="cap" style="color:var(--ok);display:flex;gap:6px;align-items:center">${ic('checkmark_circle', 'filled')}${a.n} changes</span></div></div>`).join('')}</div>`
    : `<div class="card">${ic('history')}<div class="txt">Nothing applied yet<div class="d">Runs from One-click, Guided and Optimize show up here.</div></div></div>`}`;
};

PAGES.install = () => {
  if (S.flow === 'guided') return guidedPage();
  if (S.flow === 'run') return runPage();
  if (S.flow === 'result') return resultPage();
  return `${crumbs('Install AkariOS')}
  <div class="lead">Two ways to optimize Windows. Both make a restore point first.</div>
  <div class="choose">
    <button class="tile rec" data-act="oneclick"><span class="ico">${ic('flash')}</span><b>One-click</b><span class="t2">The full AkariOS setup in one go: removes bloat, cleans and reinstalls graphics drivers, applies every AkariOS Tweak, including the ones that need Safe Mode. Your PC restarts several times.</span><span class="tf">Recommended for a fresh install</span></button>
    <button class="tile" data-act="guided"><span class="ico">${ic('wand')}</span><b>Guided</b><span class="t2">Pick the apps to remove and install and the Tweaks to apply, review everything, then apply it in one go. Nothing changes until you press Apply.</span><span class="tf">For a PC you already use</span></button>
  </div>
  <div class="sect">What One-click does</div>
  ${expander('task_list_ltr', 'Five phases, about 20 minutes', 'Akari runs them in its own console and restarts the PC between them', `<div class="row" style="padding-left:16px"><div class="phases" style="flex:1">
    ${[['Prepare', 'Allows scripts, makes a restore point, gets the graphics driver cleanup ready'], ['Drivers', 'Restarts into Safe Mode and removes graphics drivers with Display Driver Uninstaller'],
      ['Safe Mode', 'Applies the security changes that only work in Safe Mode, then restarts back'], ['Debloat and tweaks', 'Removes Store apps and features, applies every AkariOS Tweak, installs your apps'],
      ['Finish', 'Rebuilds performance counters, applies the final registry set, restarts one last time']].map(([a, b], i) => `<div class="phase"><span class="n">${i + 1}</span><div><div>${a}</div><div class="cap t2">${b}</div></div></div>`).join('')}
  </div></div>`, false)}
  ${info('warn', 'warning', 'There is no uninstaller', 'Use One-click on a fresh install or a PC you can reinstall.')}`;
};

const STEP_NAMES = ['Apps', 'Tweaks', 'Review & Apply'];
const stepsHeader = () => `<div class="steps">${STEP_NAMES.map((n, i) => `${i ? '<span class="ln"></span>' : ''}<span class="s${i === S.step ? ' cur' : i < S.step ? ' done' : ''}"><i>${i < S.step ? '✓' : i + 1}</i>${n}</span>`).join('')}</div>`;
function guidedPage() {
  const head = crumbs(['Install AkariOS', 'install', ''], 'Guided');
  if (S.step === 0) return `${head}${stepsHeader()}
    <div class="sect" style="margin-top:0">Remove</div>
    <div class="stack">${D.appx.slice(0, 10).map(a => `<div class="lrow${S.gRemove.has(a.id) ? ' sel' : ''}">${check(S.gRemove.has(a.id), 'gr:' + a.id)}${appIcon(a.icon, false, true)}<div class="t">${esc(a.name)}<div class="d">${esc(a.d)}</div></div>${badge(a)}</div>`).join('')}</div>
    <div style="margin:8px 0 0"><button class="btn sub" data-go="remove">See all ${D.appx.length} Store apps and features${ic('chevron_right')}</button></div>
    <div class="sect">Install</div>
    <div class="grid">${D.apps.slice(0, 12).map(a => `<div class="app" role="checkbox" tabindex="0" data-chk="gi:${a.id}" style="cursor:default">${appIcon(a.icon, a.mono)}<div class="n"><b>${a.name}</b><span>${a.cat}</span></div>${check(S.gInstall.has(a.id), 'gi2:' + a.id).replace('data-chk', 'data-none').replace('<button', '<span').replace('</button>', '</span>')}</div>`).join('')}</div>`;
  if (S.step === 1) return `${head}${stepsHeader()}
    ${info('', 'info', 'AkariOS Tweaks are picked for you', 'Untick anything you want to keep as it is.')}
    ${cats('Optimize').map((c, i) => {
      const ts = TW.filter(t => t.sec === 'Optimize' && t.cat === c && t.full && t.kind !== 'Action'); if (!ts.length) return '';
      const n = ts.filter(t => S.gTweaks.has(t.id)).length;
      return expander(CAT_ICON[c], c, `${ts.length} Tweaks`, ts.map(t => `<div class="row">${check(S.gTweaks.has(t.id), 'gt:' + t.id)}<div class="txt">${esc(t.name)}<div class="d">${esc(t.d)}</div></div>${badge(t)}${marks(t)}</div>`).join(''), i < 2, `<span class="cap" data-count="${c}">${n} of ${ts.length}</span>`);
    }).join('')}`;
  const rmN = S.gRemove.size, inN = S.gInstall.size, twN = S.gTweaks.size, rb = [...S.gTweaks].filter(id => TW.find(t => t.id === id).reboot).length;
  return `${head}${stepsHeader()}
    <div class="sum"><div class="c"><b>${rmN}</b><span>Apps to remove</span></div><div class="c"><b>${inN}</b><span>Apps to install</span></div><div class="c"><b>${twN}</b><span>Tweaks to apply</span></div></div>
    ${rb ? info('warn', 'warning', `${rb} changes need a restart`, 'Akari restarts once, at the end.') : ''}
    ${expander('delete', 'Remove', `${rmN} apps`, [...S.gRemove].map(id => { const a = D.appx.find(x => x.id === id); return `<div class="row">${appIcon(a.icon, false, true)}<div class="txt">${esc(a.name)}</div><span class="cap t2">Remove</span></div>`; }).join('') || '<div class="row t2">Nothing</div>', false)}
    ${expander('arrow_download', 'Install', `${inN} apps from winget`, [...S.gInstall].map(id => { const a = D.apps.find(x => x.id === id); return `<div class="row">${appIcon(a.icon, a.mono, true)}<div class="txt">${a.name}</div><span class="cap t2">Install</span></div>`; }).join('') || '<div class="row t2">Nothing</div>', false)}
    ${expander('options', 'Tweaks', `${twN} changes`, [...S.gTweaks].map(id => { const t = TW.find(x => x.id === id); return `<div class="row"><div class="txt">${esc(t.name)}<div class="d">${t.choice ? 'No change → ' + t.choice[1] : 'Off → On'}</div></div>${badge(t)}${marks(t)}</div>`; }).join(''), true)}`;
}
function runPage() {
  const r = S.run;
  return `${crumbs(['Install AkariOS', 'install', ''], r.title)}
    <div class="lead">${r.lead}</div>
    <div class="bigbar"><div class="lbl"><span id="runLbl">${r.label}</span><span id="runPct">${Math.round(r.pct)}%</span></div><div class="bar"><i id="runBar" style="width:${r.pct}%"></i></div></div>
    <div class="runbox" id="runBox">${r.items.map((it, i) => `<div class="runrow" data-ri="${i}">${it.icon ? appIcon(it.icon, it.mono, true) : ic(it.ic || 'options')}<div style="flex:1">${esc(it.name)}<div class="cap t3">${it.kind}</div></div><span class="st">${stLabel(it.st)}</span></div>`).join('')}</div>`;
}
const stLabel = st => st === 'run' ? `<svg class="ring" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/></svg>Working` : st === 'ok' ? `${ic('checkmark_circle', 'filled')}Applied` : st === 'bad' ? `${ic('error_circle', 'filled')}Failed` : st === 'skip' ? `Skipped` : 'Waiting';
function resultPage() {
  const r = S.run, ok = r.items.filter(i => i.st === 'ok').length, bad = r.items.filter(i => i.st === 'bad'), skip = r.items.filter(i => i.st === 'skip');
  return `${crumbs(['Install AkariOS', 'install', ''], 'Done')}
    ${info('ok', 'checkmark_circle', `${ok} changes applied`, bad.length ? `${bad.length} failed. See below.` : 'Everything went through.')}
    ${r.restart ? info('warn', 'warning', 'Restart to finish', 'Some changes take effect after a restart.', `<button class="btn acc" data-act="restart">Restart now</button>`) : ''}
    <div class="sum"><div class="c"><b style="color:var(--ok)">${ok}</b><span>Applied</span></div><div class="c"><b style="color:var(--bad)">${bad.length}</b><span>Failed</span></div><div class="c"><b>${skip.length}</b><span>Skipped</span></div></div>
    ${bad.length ? `<div class="sect">Needs attention</div><div class="stack">${bad.map(i => `<div class="card">${ic('error_circle')}<div class="txt">${esc(i.name)}<div class="d">${i.why}</div></div><div class="end"><button class="btn" data-act="log">Open log</button></div></div>`).join('')}</div>` : ''}
    ${skip.length ? `<div class="sect">Skipped</div><div class="stack">${skip.map(i => `<div class="card">${ic('info')}<div class="txt">${esc(i.name)}<div class="d">${i.why}</div></div></div>`).join('')}</div>` : ''}
    <div style="display:flex;gap:8px;margin-top:24px"><button class="btn acc" data-go="home">Done</button><button class="btn" data-go="optimize">Open Optimize</button></div>`;
}

PAGES.optimize = () => {
  const sec = S.arg;
  if (!sec) return `${crumbs('Optimize')}
    <div class="lead">Every Tweak, by section. Each change applies the moment you flip it, and you can switch it back the same way.</div>
    ${S.restart.size ? info('warn', 'warning', 'Restart required', `${S.restart.size} change${S.restart.size > 1 ? 's take' : ' takes'} effect after a restart.`, `<button class="btn" data-act="restart">Restart now</button>`) : ''}

    <div class="secgrid">${SECTIONS.map(s => `<button class="card click" data-go="optimize" data-arg="${s}" style="text-align:left">${ic(SEC_ICON[s])}<div class="txt">${s}<div class="d">${cats(s).slice(0, 4).join(', ')}${cats(s).length > 4 ? '…' : ''}</div></div><div class="end"><span class="cap">${TW.filter(t => t.sec === s).length}</span>${ic('chevron_right')}</div></button>`).join('')}</div>

    ${S.safeQueue.size ? info('warn', 'power', `${S.safeQueue.size} change${S.safeQueue.size > 1 ? 's wait' : ' waits'} for Safe Mode`, 'Akari restarts into Safe Mode, applies them and restarts back.', `<button class="btn" data-act="safemode">Restart into Safe Mode</button>`) : ''}
    ${S.loaded?.[sec] ? '' : `<div id="stateLoad" class="stack">${[1, 2, 3, 4].map(() => '<div class="sk"></div>').join('')}</div>`}
    <div id="secBody" style="${S.loaded?.[sec] ? '' : 'display:none'}">${cs.map(c => `<div class="sect" id="cat-${c.replace(/ /g, '_')}">${c}</div><div class="stack">${TW.filter(t => t.sec === sec && t.cat === c).map(t => tweakCard(t)).join('')}</div>`).join('')}</div>`;
};
PAGES.search = () => {
  const q = S.arg || '', ql = q.toLowerCase();

  return `${crumbs(`Results for "${esc(q)}"`)}
    ${hits.length ? `<div class="lead">${hits.length} Tweak${hits.length > 1 ? 's' : ''}</div>${[...new Set(hits.map(t => t.sec + ' › ' + t.cat))].map(g => `<div class="sect">${g}</div><div class="stack">${hits.filter(t => t.sec + ' › ' + t.cat === g).map(t => tweakCard(t, q)).join('')}</div>`).join('')}`
      : `<div class="empty">${ic('search')}<div style="font-weight:600;color:var(--tx)">No Tweaks match "${esc(q)}"</div><div>Try another word, like "Defender", "DNS" or "Game Bar".</div></div>`}`;
};

    <div class="lead">Apps, game launchers, runtimes and tools, installed from winget where possible. ${D.counts.install} in the catalogue.</div>
    <div class="cmdbar">${selbar('dl', ['All', 'Gaming', 'Browsers', 'Communication', 'Media', 'Tools', 'Development'], f)}<span class="grow"></span><span class="search" style="margin:0;width:220px;position:relative"><input class="input" id="dlq" placeholder="Search apps" value="${esc(S.dl.q)}">${ic('search')}</span></div>

const appCard = a => `<div class="app">${appIcon(a.icon, a.mono)}<div class="n"><b>${a.name}</b><span>${a.cat}</span></div><div class="act">${S.dl.installed.has(a.id) ? `<span class="done">${ic('checkmark_circle', 'filled')}Installed</span>` : S.dl.busy.has(a.id) ? `<span style="display:flex;align-items:center;gap:8px" class="cap t2"><svg class="ring" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/></svg>Installing</span>` : `<button class="btn" data-install="${a.id}">${ic('arrow_download')}Install</button>`}</div></div>`;

const RM_TABS = { 'Store apps': 'appx', 'Optional features': 'caps', 'Windows features': 'feats', 'Legacy apps': 'legacy' };

};

/* ---------- runs ---------- */
async function startRun(kind) {

    ...[...S.gRemove].map(id => { const a = D.appx.find(x => x.id === id); return { name: 'Remove ' + a.name, kind: 'Store app', icon: a.icon }; }),
    ...[...S.gTweaks].map(id => { const t = TW.find(x => x.id === id); return { name: t.name, kind: 'Tweak · ' + t.cat, ic: CAT_ICON[t.cat], reboot: t.reboot, id }; }),
    ...[...S.gInstall].map(id => { const a = D.apps.find(x => x.id === id); return { name: 'Install ' + a.name, kind: 'winget', icon: a.icon, mono: a.mono }; })];
  else items = ['Prepare: allow scripts, restore point', 'Drivers: remove graphics drivers (Safe Mode)', 'Safe Mode: security changes', 'Debloat: remove Store apps and features', 'Tweaks: apply every AkariOS Tweak', 'Apps: install your launchers and tools', 'Finish: performance counters and registry']
    .map((n, i) => ({ name: n.split(': ')[1].replace(/^./, c => c.toUpperCase()), kind: n.split(': ')[0], ic: ['task_list_ltr', 'arrow_download', 'shield', 'delete', 'options', 'apps', 'checkmark_circle'][i] }));
  items.forEach(i => i.st = 'wait');
  S.run = { kind, title: kind === 'guided' ? 'Applying' : 'One-click', lead: kind === 'guided' ? 'Keep Akari open. Changes apply one after another; Explorer restarts once at the end.' : 'Keep your PC on. Akari restarts it between phases and carries on by itself.', items, pct: 0, label: 'Starting…', restart: false };
  S.flow = 'run'; S.page = 'install'; go('install', null, false);
  const tst = toast('Applying changes', `<div class="bar indet" style="margin-top:10px"><i></i></div>`, true);
  const fail = kind === 'guided' ? items.findIndex(i => /Network|Power/.test(i.kind)) : -1;
  for (let i = 0; i < items.length; i++) {
    const it = items[i]; it.st = 'run'; updRun(i);
    await sleep(kind === 'guided' ? 260 + Math.random() * 260 : 900);
    if (i === fail && kind === 'guided') { it.st = 'bad'; it.why = 'The network adapter refused the change. Open the log for details, or try again after a restart.'; }
    else if (/7-Zip/.test(it.name)) { it.st = 'skip'; it.why = 'Already installed.'; }
    else it.st = 'ok';

    S.run.pct = (i + 1) / items.length * 100; updRun(i);
  }

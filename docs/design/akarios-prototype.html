  const ok = items.filter(i => i.st === 'ok').length;
  S.activity.unshift({ title: kind === 'guided' ? 'Guided run' : 'One-click', when: 'Just now · Install AkariOS', n: ok, icon: kind === 'guided' ? 'wand' : 'flash' });
  toast('All done', `${ok} changes applied.${S.run.restart ? ' Restart to finish.' : ''}`);
  S.flow = 'result'; if (S.page === 'install') render(true);
}
function updRun(i) {
  if (!(S.page === 'install' && S.flow === 'run')) return;
  const it = S.run.items[i], row = $(`[data-ri="${i}"]`);
  if (row) { const st = $('.st', row); st.className = 'st ' + it.st; st.innerHTML = stLabel(it.st); if (it.st === 'run') row.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' }); }
  $('#runBar').style.width = S.run.pct + '%'; $('#runPct').textContent = Math.round(S.run.pct) + '%';
  $('#runLbl').textContent = it.st === 'run' ? it.name + '…' : S.run.label;
}
async function removeApps() {
  const ids = [...S.rm.sel], tab = S.rm.tab;
  const tst = toast(`Removing ${ids.length} app${ids.length > 1 ? 's' : ''}`, `<div class="bar indet" style="margin-top:10px"><i></i></div>`, true);
  for (const id of ids) {
    await sleep(380);
    const row = $(`[data-rmrow="${id}"]`);
    if (row && !reduced()) { const h = row.offsetHeight; await row.animate([{ opacity: 1, height: h + 'px', transform: 'none' }, { opacity: 0, height: '0px', transform: 'translateX(24px)', paddingTop: 0, paddingBottom: 0, marginTop: '-4px' }], { duration: 250, easing: EASE, fill: 'forwards' }).finished; }
    S.rm.gone.add(id); S.rm.sel.delete(id); row?.remove(); if (S.page === 'remove' && S.rm.tab === tab) updateRmBar();
  }
  tst.classList.add('out'); setTimeout(() => tst.remove(), 170);
  S.activity.unshift({ title: `Removed ${ids.length} app${ids.length > 1 ? 's' : ''}`, when: 'Just now · Remove apps', n: ids.length, icon: 'delete' });
  toast('Removed', `${ids.length} app${ids.length > 1 ? 's are' : ' is'} gone.`);
}

/* ---------- flyouts, dialogs, toasts, tooltips ---------- */
function openCombo(btn) {
  closeFly();
  const id = btn.dataset.combo, r = btn.getBoundingClientRect(), f = document.createElement('div'); f.className = 'flyout';
  let opts;
  if (id === 'accent') opts = [['Akari crimson', 'akari'], ['Windows accent', 'windows']];
  else if (id.startsWith('tw:')) { const t = TW.find(x => x.id === id.slice(3)); opts = t.choice[0].map(c => [c, c === t.choice[1] ? 'Recommended' : c === t.choice[2] ? 'Windows default' : '']); }
  else opts = [[btn.textContent.trim(), '']];
  const cur = btn.textContent.trim();
  f.innerHTML = opts.map(([n, s]) => `<div class="it${n === cur ? ' sel' : ''}" data-v="${esc(s)}" data-n="${esc(n)}">${esc(n)}${s && id !== 'accent' ? `<small>${s}</small>` : ''}</div>`).join('');
  document.body.appendChild(f);
  const fr = f.getBoundingClientRect(), below = innerHeight - r.bottom > fr.height + 8;
  f.style.left = Math.min(r.left, innerWidth - fr.width - 8) + 'px'; f.style.top = (below ? r.bottom + 4 : r.top - fr.height - 4) + 'px'; f.style.minWidth = r.width + 'px';
  f.addEventListener('click', ev => {
    const it = ev.target.closest('.it'); if (!it) return; ev.stopPropagation();
    if (id === 'accent') document.documentElement.dataset.accent = it.dataset.v;
    if (id.startsWith('tw:')) { const t = TW.find(x => x.id === id.slice(3)); ST[t.id] = it.dataset.n; if (t.reboot) S.restart.add(t.id); }
    btn.firstChild.textContent = it.dataset.n; closeFly();
  });
}
function closeFly() { $$('.flyout, .suggest').forEach(f => f.remove()); }
function dialog(title, body, okText, cb, altText) {
  const s = document.createElement('div'); s.className = 'smoke';
  s.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><div class="b"><h3>${title}</h3>${body}</div><div class="f" style="${altText ? 'grid-template-columns:1fr 1fr 1fr' : ''}"><button class="btn acc" data-ok>${okText}</button>${altText ? `<button class="btn" data-alt>${altText}</button>` : ''}<button class="btn" data-no>Cancel</button></div></div>`;
  $('#win').appendChild(s);
  const close = v => { s.classList.add('out'); setTimeout(() => s.remove(), 170); cb && cb(v); };
  s.addEventListener('click', e => { if (e.target.closest('[data-ok]')) close(true); else if (e.target.closest('[data-alt]')) close('later'); else if (e.target.closest('[data-no]') || e.target === s) close(false); });
  setTimeout(() => $('[data-ok]', s).focus(), 60);
}
function toast(title, body, sticky) {
  $$('.toast:not(.out)').forEach(t => { if (!sticky) { t.style.transform = 'translateY(-100%)'; } });
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `${logo(20)}<div style="flex:1"><b style="font-weight:600">${title}</b><div class="cap t2" style="margin-top:2px">${body}</div></div>${sticky ? '' : `<button class="x" style="width:24px;height:24px;border-radius:4px;display:grid;place-items:center;color:var(--tx2)">${ic('dismiss')}</button>`}`;
  const stack = $$('.toast:not(.out)'); t.style.bottom = (20 + stack.reduce((h, x) => h + x.offsetHeight + 8, 0)) + 'px';
  $('#win').appendChild(t);
  const bye = () => { t.classList.add('out'); setTimeout(() => { t.remove(); restack(); }, 170); };
  t.querySelector('.x')?.addEventListener('click', bye);
  if (!sticky) setTimeout(bye, 4200);
  return t;
}
function restack() { let y = 20; $$('.toast:not(.out)').forEach(t => { t.style.transition = 'bottom 250ms cubic-bezier(0,0,0,1)'; t.style.bottom = y + 'px'; y += t.offsetHeight + 8; }); }
let tipT, tipEl;
document.addEventListener('mouseover', e => {
  const h = e.target.closest('[data-tip], .win.compact .ni, [data-t]'); clearTimeout(tipT); tipEl?.remove(); tipEl = null; if (!h) return;
  const txt = h.dataset.tip || h.dataset.t || h.textContent.trim(); if (!txt) return;
  tipT = setTimeout(() => { const r = h.getBoundingClientRect(); tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.textContent = txt; document.body.appendChild(tipEl);
    const compactNav = h.classList.contains('ni'); tipEl.style.left = (compactNav ? r.right + 8 : Math.min(r.left, innerWidth - tipEl.offsetWidth - 8)) + 'px'; tipEl.style.top = (compactNav ? r.top + 8 : r.bottom + 6) + 'px'; }, 600);
});

document.addEventListener('input', e => {
  if (e.target.id !== 'dlq') return; S.dl.q = e.target.value; const f = S.dl.filter, v = S.dl.q.toLowerCase();
  const list = D.apps.filter(a => (f === 'All' || a.cat === f) && (!v || a.name.toLowerCase().includes(v)));
  $('#dlGrid').innerHTML = list.map(appCard).join('') || `<div class="empty" style="grid-column:1/-1">${ic('search')}<div>No apps match "${esc(S.dl.q)}"</div></div>`;
});
/* ---------- search (AutoSuggestBox) ---------- */
const q = $('#q');
q.addEventListener('input', () => {
  closeFly(); $('.ttip')?.remove(); const v = q.value.trim(); if (!v) return;
  const hits = TW.filter(t => (t.name + ' ' + t.d).toLowerCase().includes(v.toLowerCase())).slice(0, 6);
  const r = q.getBoundingClientRect(), f = document.createElement('div'); f.className = 'suggest';
  f.innerHTML = hits.length ? hits.map((t, i) => `<div class="it${i === 0 ? ' hi' : ''}" data-hit="${t.id}">${ic(CAT_ICON[t.cat] || 'settings')}<div class="t">${hl(t.name, v)}<div>${t.sec} › ${t.cat}</div></div></div>`).join('') + `<div class="more">Press Enter to see every result</div>`
    : `<div class="more" style="color:var(--tx2)">No Tweaks match "${esc(v)}"</div>`;
  f.style.left = r.left + 'px'; f.style.top = (r.bottom + 4) + 'px'; document.body.appendChild(f);
  f.addEventListener('click', ev => { const h = ev.target.closest('[data-hit]'); if (!h) return; const t = TW.find(x => x.id === h.dataset.hit); q.value = ''; closeFly(); go('optimize', t.sec); setTimeout(() => { const row = $(`[data-row="${t.id}"]`); if (row) { row.scrollIntoView({ block: 'center', behavior: 'smooth' }); row.animate([{ background: 'var(--accSoft)' }, { background: 'var(--card)' }], { duration: 1600, easing: 'ease-out' }); } }, 800); });
});
q.addEventListener('keydown', e => {
  const items = $$('.suggest .it'); let i = items.findIndex(x => x.classList.contains('hi'));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!items.length) return; items[i]?.classList.remove('hi'); i = (i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; items[i].classList.add('hi'); }
  if (e.key === 'Enter' && q.value.trim()) { const v = q.value.trim(); closeFly(); go('search', v); }
  if (e.key === 'Escape') { q.value = ''; closeFly(); q.blur(); }
});

/* ---------- theme, window, keyboard ---------- */
function setTheme(v) {
  document.documentElement.dataset.themePref = v;
  const t = v === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : v;
  if (reduced()) { document.documentElement.dataset.theme = t; return; }
  const veil = document.createElement('div'); veil.style.cssText = 'position:fixed;inset:0;background:var(--mica);z-index:999;opacity:0;pointer-events:none;transition:opacity 120ms linear';
  document.body.appendChild(veil); requestAnimationFrame(() => veil.style.opacity = '.6');
  setTimeout(() => { document.documentElement.dataset.theme = t; veil.style.opacity = '0'; setTimeout(() => veil.remove(), 160); }, 120);
}
let userCompact = null;
function setCompact(c) { $('#win').classList.toggle('compact', c); setTimeout(() => placePill(navItemFor(S.page, S.arg), false), 260); }
new ResizeObserver(([e]) => { const w = e.contentRect.width; if (userCompact === null) setCompact(w < 1000); }).observe($('#win'));
function toggleMax() { $('#win').classList.toggle('max'); }
document.addEventListener('keydown', e => {
  if (e.key === 'Tab') document.body.classList.add('kb');
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-exp], div[data-chk]')) { e.preventDefault(); e.target.click(); }
  if ((e.ctrlKey && e.key.toLowerCase() === 'f') || (e.ctrlKey && e.key.toLowerCase() === 'e')) { e.preventDefault(); if ($('#win').classList.contains('compact')) setCompact(false); q.focus(); }
  if (e.altKey && e.key === 'ArrowLeft') $('#back').click();
  if (e.key === 'Escape') { closeFly(); const s = $('.smoke'); if (s) $('[data-no]', s).click(); }
});
document.addEventListener('mousedown', () => document.body.classList.remove('kb'));
$('#scroll').addEventListener('scroll', () => {
  const bar = $('.selbar[data-sel="cat"]'); if (!bar) return;
  const secs = $$('#secBody .sect'); let cur = secs[0];
  const top = $('#scroll').getBoundingClientRect().top; secs.forEach(s => { if (s.getBoundingClientRect().top - top <= 80) cur = s; });
  if ($('#scroll').scrollTop < 8 || !$('#secBody')?.offsetParent) cur = secs[0];
  if (!cur) return; const name = cur.textContent;
  $$('button', bar).forEach(b => b.classList.toggle('on', b.dataset.selv === name)); placeUl(bar);
});

go('home', null, false);
setTimeout(() => { // first-run teaching tip on the search box
  const r = q.getBoundingClientRect(), tip = document.createElement('div'); tip.className = 'ttip';
  tip.innerHTML = `<b>Search every Tweak</b><div class="cap t2">${D.counts.tweaks} Tweaks across Optimize, Customize, Hardware, Advanced and Tools. Press Ctrl+F from anywhere.</div><div class="acts"><button class="btn acc" data-act="tip-ok" style="min-width:0">Got it</button></div>`;
  tip.style.left = (r.right + 14) + 'px'; tip.style.top = (r.top - 8) + 'px'; if (!$('#win').classList.contains('compact')) document.body.appendChild(tip);
}, 1400);

</script>
